# /etc/default/gpu-temp-guard
# Restart the service after editing: systemctl restart gpu-temp-guard

# Cards to guard: comma-separated substrings of the nvidia-smi name. Empty = every card.
GUARD_MATCH=
# Cards to leave alone: comma-separated PCI bus ids as nvidia-smi prints them (21:00.0 is enough).
# Exclude any card whose hotspot/VRAM readings from gputemps look wrong.
GUARD_EXCLUDE_BUSES=
# gputemps binary (name on PATH or full path).
GUARD_GPUTEMPS=gputemps

# Thresholds. Defaults were picked for RTX 3090s.
GUARD_TRIP_C=94
GUARD_RESTORE_C=85
GUARD_RESTORE_HOLD_S=300
GUARD_STEP_W=20
GUARD_STEP_INTERVAL_S=60
GUARD_FLOOR_W=150
GUARD_POLL_S=5
